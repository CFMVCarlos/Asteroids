[project]
name = "asteroids"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Carlos Valente", email = "cfmvcarlos@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pygame==2.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asteroids"]

[dependency-groups]
dev = [
    "basedpyright==1.39.10",
    "pydoclint==0.9.1",
    "ruff==0.16.5",
    "ty==0.0.78",
]

[tool.pydoclint]
style = "numpy"
exclude = '\.venv|\.agents|__pycache__'

[tool.basedpyright]
typeCheckingMode = "standard"
exclude = [".venv", ".agents"]
